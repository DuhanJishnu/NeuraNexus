name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-light RAG unit tests
        run: python -m unittest discover -s python_server/tests -v

  node-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/validation
    defaults:
      run:
        working-directory: node_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node_server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm test

  client-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
